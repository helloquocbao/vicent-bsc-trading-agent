[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vicent"
version = "0.1.0"
description = "Volatility-Informed Crypto Execution & Negotiation Trader — autonomous self-custody AI trading agent on BSC. BNB Hack Track 1."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VICENT" }]
keywords = ["bnb", "bsc", "ai-agent", "trading", "trustwallet", "coinmarketcap", "x402", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "tenacity>=8.2",
    "python-dateutil>=2.9",
    "aiohttp>=3.9",
    "hyperliquid-python-sdk>=0.8",
]

[project.optional-dependencies]
onchain = [
    "web3>=6.20",
    "eth-account>=0.11",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-python-dateutil",
]

[project.scripts]
vicent = "vicent.cli:app"

[project.urls]
Homepage = "https://dorahacks.io/hackathon/bnbhack-twt-cmc/"

[tool.hatch.build.targets.wheel]
packages = ["src/vicent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
